# Captions of the figures (British English). `replaces` names the figure of the submitted PDF.
fig4_ci_findspots:
  replaces: Fig. 4
  caption: >-
    Campanian Ignimbrite findspots with fuzzy-sl certainty qualifiers, as published in the geo-lod graph. (a) The 74
    findspots by the certainty level of their coordinate; dashed rings mark 500 km and 1000 km from the Phlegraean
    Fields, the source area of the eruption. (b) One coordinate statement, Urluia (Romania), with its qualifiers:
    certainty level and description, method, source type, literature and acting person. Licence: Florian Thiery and
    Fiona Schenk, CC BY 4.0; base map: Natural Earth, public domain.
