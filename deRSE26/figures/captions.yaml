# Captions of the figures (British English). `replaces` names the figure of the submitted PDF.
fig4_ci_findspots:
  replaces: Fig. 4
  caption: >-
    Campanian Ignimbrite findspots in the geo-lod graph and one coordinate statement in the fuzzy-sl Wikibase. (A) The
    74 findspots, distinguished by whether they are typed as archaeological sites (12) or not (62); dashed rings mark
    500 km and 1000 km from the Phlegraean Fields, the source area of the eruption. (B) The coordinate statement of
    Auel Maar AU3 (Q70) with its qualifiers: certainty level and description, method, acting person, source type,
    precision, location and point type, and the literature reference. Purple: vocabulary terms; grey: items; white: literals. The inset map shows the Eifel around the Auel Maar with rivers, borders, Cologne and Daun. Licence: Florian Thiery and Fiona Schenk,
    CC BY 4.0; base map: Natural Earth, public domain.

fig3_fuzzysl_datamodel:
  replaces: Fig. 3
  caption: >-
    Data model of the fuzzy-sl Wikibase. (GLM) Geolocation metadata: a fuzzy-sl entity has a label and a description
    and is described by its instance type (P1), project (P3), literature reference (P11), related external resource
    with its relation type (P10, qP12), spatial type (P8), spatial category (P26), the administrative territorial entity in Wikidata (P32) and
    its coordinate (P4). (CM) Coordinate metadata: the coordinate statement carries ten qualifiers (solid arrows:
    certainty level and description, method used and description, acting person, source type in generic and detailed
    form, location type, point type and precision) and three reference properties (dashed arrows: reference URL,
    reference string, reference item). Grey: instance; purple: vocabulary item with its Q number; dashed outline:
    external resource; white: literal; black: coordinate. Property labels and classes are those of the static copy of
    the fuzzy-sl Wikibase. Licence: Florian Thiery, CC BY 4.0.

fig10_arno_spatial:
  replaces: Fig. 10
  caption: >-
    Spatial classes of the Archaeo-Natural Ontology (ArNO) and their use in the Poseidon network schema. (A) Class
    hierarchy: hollow arrows point from a subclass to its superclass; the four classes defined in ArNO (red outline,
    Discovery Site, Site, Place, Country) sit below the Pleiades, LADO, GeoSPARQL and CIDOC CRM classes that they extend.
    (B) The spatial node types of the Poseidon network: an ancient DNA sample is found at a discovery site, which lies
    at a site, at a place, in a country; the discovery site has a point geometry with a WKT literal, and the
    nodes carry labels and, for the country, an ISO code. Dark orange: classes; white: literals; amber: object and
    data properties. Redrawn after Mattis thor Straten et al. (2025) from ArNO and poseidon2lod. Licence: Mattis thor
    Straten and Florian Thiery, CC BY 4.0.

z2_one_stone_five_models:
  replaces: new figure (end of Section 3 or Section 4; placement open)
  caption: >-
    One coordinate in five modelling styles, shown for the Ogham stone Coumeenole North (Macalister 1945, textual
    description). (A) Wikidata: coordinate location with its qualifiers. (B) fuzzy-sl Wikibase: the coordinate
    statement carries certainty level, method, precision and location type as qualifiers. (C) RDF with GeoSPARQL: the
    point is a geo:asWKT literal of a geometry resource. (D) Labelled property graph: the point is a property of the
    node. (E) Heterogeneous information network: the point is a node of its own, so that nearby geolocations can be
    linked by distance classes. Red outline: where the coordinate sits. Data: Wikidata (CC0), fuzzy-sl Wikibase,
    Florian Thiery, CC BY 4.0.

z3_showcase_map:
  replaces: new figure (Section 5, overview)
  caption: >-
    Where the spatial showcases are. (A) Europe and the Mediterranean: coordinate statements of the fuzzy-sl Wikibase
    (61; Ogham stones, Roman Britain, Bruttium coin finds, Campanian Ignimbrite and others), the Campanian Ignimbrite
    findspots of the geo-lod graph (74) and the BB-5KBC findspots (540). (B) The 365 SISAL caves of the geo-lod graph;
    the red frame marks panel A. The property-graph and HIN showcases are not mapped because they have no point
    dataset of their own. Base map: Natural Earth, public domain.

fig7_ci_instances:
  replaces: Fig. 7
  caption: >-
    Two Campanian Ignimbrite findspots as instances in the geo-lod graph: (A) Toplitsa Cave (Bulgaria, ci:cisite_44)
    and (B) Franchthi Cave (Greece, ci:cisite_45). Both are typed as fsl:Site and geolod:CIArchaeologicalSite (a
    selection of their types is shown), carry the geometry as an sf:Point with a geo:asWKT literal and the fuzzy-sl
    certainty level, certainty description and literature reference, are aligned to Wikidata and OpenStreetMap via
    skos:closeMatch, and name the pipeline activity that generated them. The coordinate reference system prefix of
    the WKT literal is omitted. Colours: dark orange classes, purple vocabulary terms, grey instances, white literals. Minimaps: all 74 findspots (filled: archaeological site), the findspot of the panel ringed in red; country borders and major rivers from Natural Earth. Licence: Florian Thiery and Fiona Schenk, CC BY 4.0.

fig6_place_taxonomy:
  replaces: Fig. 6 (slice; the full pipeline scheme moves to the supplement or stays as it is)
  caption: >-
    Modelling places in the geo-lod ontologies. (A) The place classes and their anchors in CIDOC CRM, CRMarchaeo and
    fuzzy-sl; hollow arrows are rdfs:subClassOf statements of the ontology files (geo_lod_core.ttl, crm_bridging.ttl,
    sisal_ontology.ttl, epica_ontology.ttl). Sampling locations (drilling site, borehole, cave) and Campanian
    Ignimbrite findspots both specialise crm:E27_Site; the archaeological variants additionally inherit from
    crmarchaeo:A2_Stratigraphic_Volume_Unit. (B) The geometry of a place: a geo:Feature has a geo:Geometry (sf:Point,
    which CRMgeo reads as a declarative place; its inheritance from geo:Geometry is defined by GeoSPARQL and Simple Features, not by the ontology files) whose coordinates are a geo:wktLiteral. Dark orange: classes of the
    geo-lod ontologies; white: external classes; amber: property. Licence: Florian Thiery and Fiona Schenk, CC BY 4.0.

fig5_bb5kbc_spatial:
  replaces: Fig. 5
  caption: >-
    Spatial part of the BB-5KBC ontology. (A) Classes and properties around the place of a findspot: a Fundstelle
    (CIDOC CRM E27 Site) lies in a municipality (Gemeinde, with external identifiers such as Wikidata, GeoNames, Getty
    TGN and OpenStreetMap), district (Kreis), federal state (Bundesland) and country (Land); it has a GeoSPARQL point
    geometry with a WKT literal, and it was georeferenced by a georeferencing activity (E13 Attribute Assignment) that
    records method, source type and person. Dark orange: classes; white boxes: attributes with their datatypes; amber:
    properties. (B) One of the 540 findspots, Seelow 20 (red ring on the map), as an instance: the point geometry, its
    accuracy (±1000 m, because the published coordinates are rounded to two decimal places), the precision (±0.01°), the certainty level and location type from the fuzzy-sl vocabulary, the municipality and the
    georeferencing activity. Data: BB-5KBC bundle (commit c2e989b); base map: Natural Earth. Licence: Florian Thiery &
    Sophie C. Schmidt, CC BY 4.0.

fig1_fkge:
  replaces: Fig. 1
  caption: >-
    Scheme of the Federated Knowledge Graph Ecosystem. Licence: Florian Thiery & Andreas Noback, CC BY 4.0.

fig9_arno_modules:
  replaces: Fig. 9
  caption: >-
    The ontologies combined in the ArNO ontology, grouped by the concept domain they are used for (redrawn after the
