    OSM maps: OpenStreetMap Contributors, Open Database License.'
  notes:
  - 'v3: archaeology vs. other, Auel Maar AU3 from the static Wikibase copy, minimap'
  - Static Wikibase has 19 CI items, the graph 74
- n: 5
  old: bb-5kbc-ontology.jpg
  section: §5.3 BB-5KBC
  status: done
  title: The bb5kbc ontology (spatial part)
  new: fig5_bb5kbc_spatial
  caption_old: The bb5kbc Ontology. Licence -- Florian Thiery & Sophie C. Schmidt, CC BY 4.0.
  notes:
  - "Redrawn from data/bb5kbc-bundle.ttl (bb-5kbc-public, commit c2e989b, 2026-09-15; 540 findspots); the old picture was a Mermaid class diagram"
  - "Example findspot: Seelow 20 (site_80). The bundle still stores hatGenauigkeit 0.0; the figure shows +-1000 m (published coordinates rounded to 2 decimals, JCM 2026 slides) and a precision of +-0.01 degrees, which is not in the data yet: update bb-5kbc-public and re-check the figure"
  - "Geo focus: only the spatial classes (Fundstelle, Gemeinde, Kreis, Bundesland, Land, Point, GeoreferenzierungsAktivitaet); the non-geo classes are omitted and could go into a supplement version"
  - "The data model has changed since the old picture (geo:hasGeometry, fsl certainty and location type, georeferencing activity); every property is asserted against the bundle"
