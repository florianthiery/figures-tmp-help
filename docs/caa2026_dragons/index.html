<h1>Federating the Dragons: figures</h1><p class="lead">CAA 2026 proceedings paper, 13 figures as used in the manuscript, each with its file name and caption.</p>
<figure id="fig-layers"><img src="img/fig-layers.png" alt="fig-layers.png"><figcaption><b>Fig. 1</b> <code>img/fig-layers.png</code><br>The federated Knowledge Graph ecosystem with its LOD layer, community layer (Wikibase instances and OpenStreetMap) and FDO layer.</figcaption></figure>
<figure id="fig-fdox"><img src="img/fig-fdox.png" alt="fig-fdox.png"><figcaption><b>Fig. 2</b> <code>img/fig-fdox.png</code><br>FDOx package structure and conversion of a ZIP package into an RDF representation with fdo-squirrel.</figcaption></figure>
<figure id="fig-fdoxsteps"><img src="img/fig-fdoxsteps.png" alt="fig-fdoxsteps.png"><figcaption><b>Fig. 3</b> <code>img/fig-fdoxsteps.png</code><br>The four-step FDOx pattern: the package is encapsulated as an FDO, described with semantic metadata and paradata, linked to community hubs and integrated into the federated Knowledge Graph.</figcaption></figure>
<figure id="fig-ontology"><img src="img/fig-ontology.png" alt="fig-ontology.png"><figcaption><b>Fig. 4</b> <code>img/fig-ontology.png</code><br>Extract from the Linked Open Ogham ontology with the stone I-COR-030 (Garranes, CIIC 81) as E22 Human-Made Object, its inscribed surface (E25), the inscription (TX1 Written Text) and its reading (TX7 Written Text Segment), derived from the TEI/EpiDoc edition .</figcaption></figure>
<figure id="fig-query"><img src="img/fig-query.png" alt="fig-query.png"><figcaption><b>Fig. 5</b> <code>img/fig-query.png</code><br>Federated SPARQL query between Semantic Kompakkt, Wikidata, FactGrid and the fuzzy-sl Wikibase, linked by SERVICE clauses.</figcaption></figure>
<figure id="fig-ciic81-fdo"><img src="img/fig-ciic81-fdo.png" alt="fig-ciic81-fdo.png"><figcaption><b>Fig. 6</b> <code>img/fig-ciic81-fdo.png</code><br>FDOx package of the 3D model of CIIC 81 and the software FDO o3d-epidoc-extractor in the registry of FDOx: persistent identifiers, files, licence and links to Wikidata and OpenStreetMap. The dashed arc is a proposal and not yet part of the data.</figcaption></figure>
<figure id="fig-oghamgraph"><img src="img/fig-oghamgraph.png" alt="fig-oghamgraph.png"><figcaption><b>Fig. 7</b> <code>img/fig-oghamgraph.png</code><br>The Ogham stone as a hub in the FDOx registry. The Wikidata item of the inscribed stone links two 3D data FDOs (green boxes: software FDOs; purple boxes: 3D data FDOs) and two software FDOs through dct:subject; dct:spatial points to OpenStreetMap relation and node. Dashed: the link is free text only or a second node for the same place.</figcaption></figure>
<figure id="fig-geoworkflow"><img src="img/fig-geoworkflow.png" alt="fig-geoworkflow.png"><figcaption><b>Fig. 8</b> <code>img/fig-geoworkflow.png</code><br>The geo-lod demonstrator: three datasets (EPICA Dome C, SISAL, Campanian Ignimbrite findspots), one reproducible Python pipeline, a graph anchored in the CIDOC CRM family and its publication. Figure CC BY 4.0.</figcaption></figure>
<figure id="fig-geomeasure"><img src="img/fig-geomeasure.png" alt="fig-geomeasure.png"><figcaption><b>Fig. 9</b> <code>img/fig-geomeasure.png</code><br>From one table row of EPICA Dome C to the CIDOC CRM family and its extensions. Data: Spahni and Stocker (2006), doi:10.1594/PANGAEA.472484; figure CC BY 4.0.</figcaption></figure>
<figure id="fig-geomap"><img src="img/fig-geomap.jpg" alt="fig-geomap.jpg"><figcaption><b>Fig. 10</b> <code>img/fig-geomap.jpg</code><br>All 442 sites that geo-lod publishes with a position (EPICA 3, SISAL 365, Campanian Ignimbrite 74), drawn from the RDF graph. Basemap: Natural Earth; figure CC BY 4.0.</figcaption></figure>
<figure id="fig-map"><img src="img/fig-map.png" alt="fig-map.png"><figcaption><b>Fig. 11</b> <code>img/fig-map.png</code><br>Ogham stones, SISAL caves and Campanian Ignimbrite findspots on one map of Europe and the Mediterranean. Purple circles: Ogham stones (363 distinct positions in the frame, from the TEI/EpiDoc crosswalk); green circles: SISAL caves (105); red squares: Campanian Ignimbrite findspots (69). Sites outside the frame are not drawn. Basemap: Natural Earth.</figcaption></figure>
<figure id="fig-geo"><img src="img/fig-geo.png" alt="fig-geo.png"><figcaption><b>Fig. 12</b> <code>img/fig-geo.png</code><br>Modelling principle for speleothem caves and Campanian Ignimbrite findspots as places, with Franchthi Cave modelled in the fuzzy-sl model. Data: geo-lod (SISAL, campanian-ignimbrite-geo).</figcaption></figure>
<figure id="fig-geolinked"><img src="img/fig-geolinked.png" alt="fig-geolinked.png"><figcaption><b>Fig. 13</b> <code>img/fig-geolinked.png</code><br>Where the graph opens up: a stalagmite as a node, linked to the CIDOC CRM family, its cave, Wikidata, OpenStreetMap, DOIs, ORCID and its source repository. Figure CC BY 4.0.</figcaption></figure>
