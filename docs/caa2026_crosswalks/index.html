<h1>Crosswalking the Dragons: figures</h1><p class="lead">CAA 2026 proceedings paper on the Crossys (OCMDP, MaCHeCO, JNL), 13 figures with file names and working captions. Figs. 10 to 13 are not yet in the manuscript.</p>
<figure id="fig-architecture"><img src="img/fig-architecture.png" alt="fig-architecture.png" loading="lazy"><figcaption><b>Fig. 1</b> <code>img/fig-architecture.png</code><br>The three Crossys and the worlds they connect. OCMDP and MaCHeCO relate application metadata and application ontologies to reference models; the JNL couples both and binds terminologies; together they feed the NFDI4Objects Knowledge Graph.</figcaption></figure>
<figure id="fig-correspondence"><img src="img/fig-correspondence.png" alt="fig-correspondence.png" loading="lazy"><figcaption><b>Fig. 2</b> <code>img/fig-correspondence.png</code><br>Types of correspondence by level: subsumption for classes, graded SKOS relations for metadata, skos:exactMatch for concepts and owl:sameAs for individuals.</figcaption></figure>
<figure id="fig-jnl"><img src="img/fig-jnl.png" alt="fig-jnl.png" loading="lazy"><figcaption><b>Fig. 3</b> <code>img/fig-jnl.png</code><br>The Junction Node Layer. A schema-level junction constrains the object class of an OCMDP term; three instance-level junctions link metadata resources to domain entities and values to terminologies.</figcaption></figure>
<figure id="fig-rules"><img src="img/fig-rules.png" alt="fig-rules.png" loading="lazy"><figcaption><b>Fig. 4</b> <code>img/fig-rules.png</code><br>Crosswalk rules R1 to R5 as three tracks: metadata (R3, then R4), ontology (R1, then R2) and terminology binding (R5). All three lead to validation, which is planned as SHACL shapes, and to the target graph.</figcaption></figure>
<figure id="fig-pipeline"><img src="img/fig-pipeline.png" alt="fig-pipeline.png" loading="lazy"><figcaption><b>Fig. 5</b> <code>img/fig-pipeline.png</code><br>From curation to publication: community curation in the CrossyBase Wikibase, export by SPARQL and Python, SHACL validation and publication for reuse. Invalid output returns to curation. Dashed: planned.</figcaption></figure>
<figure id="fig-projects"><img src="img/fig-projects.png" alt="fig-projects.png" loading="lazy"><figcaption><b>Fig. 6</b> <code>img/fig-projects.png</code><br>Projects and the Crossys they use, grouped by the section in which they appear; the last two rows are only listed. Filled: the project uses the Crossy; dashed: not used or not confirmed.</figcaption></figure>
<figure id="fig-mds"><img src="img/fig-mds.png" alt="fig-mds.png" loading="lazy"><figcaption><b>Fig. 7</b> <code>img/fig-mds.png</code><br>OCMDP example. Fields of the minimum record (MDS) map to OCMDP terms and from there to Wikidata. Label and inventory number match exactly, the object type only as a broad match, and for material, technique, dimensions and inscription the choice between candidate properties is recorded with a scope note. R3 and R5 refer to the crosswalk rules. Dashed: not yet confirmed.</figcaption></figure>
<figure id="fig-ciic81"><img src="img/fig-ciic81.png" alt="fig-ciic81.png" loading="lazy"><figcaption><b>Fig. 8</b> <code>img/fig-ciic81.png</code><br>JNL example. The 3D model of the Ogham stone CIIC 81 is described in the metadata graph by OCMDP terms; the stone it depicts is described in the domain graph in CIDOC CRM. A graph junction links the two, and two terminology junctions bind the object type and the stone itself to vocabularies and authority files. R1 to R5 refer to the crosswalk rules. Dashed: not yet confirmed.</figcaption></figure>
<figure id="fig-geo"><img src="img/fig-geo.png" alt="fig-geo.png" loading="lazy"><figcaption><b>Fig. 9</b> <code>img/fig-geo.png</code><br>The MaCHeCO pattern at the scale of a pipeline. Each external class that geo-lod instantiates is subsumed under one CIDOC CRM family class; a coverage gate checks that every typed instance reaches such a class.</figcaption></figure>
<figure id="fig-chublets"><img src="img/fig-chublets.png" alt="fig-chublets.png" loading="lazy"><figcaption><b>Fig. 10</b> <code>img/fig-chublets.png</code><br>OCMDP example, software metadata. Citation File Format fields map to OCMDP terms (CodeMeta names, provisional) and from there to Wikidata properties.</figcaption></figure>
<figure id="fig-holywells"><img src="img/fig-holywells.png" alt="fig-holywells.png" loading="lazy"><figcaption><b>Fig. 11</b> <code>img/fig-holywells.png</code><br>MaCHeCO example. Wikidata classes of holy wells and related water and religious sites are subsumed under CIDOC CRM classes. Data: wd-holywells-static.</figcaption></figure>
<figure id="fig-ignimbrite"><img src="img/fig-ignimbrite.png" alt="fig-ignimbrite.png" loading="lazy"><figcaption><b>Fig. 12</b> <code>img/fig-ignimbrite.png</code><br>JNL example. The Campanian Ignimbrite findspot Franchthi Cave in geo-lod: its types are anchored in CIDOC CRM classes and its place is matched to Wikidata and OpenStreetMap. Data: geo-lod.</figcaption></figure>
<figure id="fig-federated"><img src="img/fig-federated.png" alt="fig-federated.png" loading="lazy"><figcaption><b>Fig. 13</b> <code>img/fig-federated.png</code><br>The federated query of Federating the Dragons seen through the Crossys: each SERVICE block calls a platform, identifiers link the platforms, and MaCHeCO subsumes their classes under CIDOC CRM classes.</figcaption></figure>
